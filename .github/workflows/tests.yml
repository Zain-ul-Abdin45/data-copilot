name: tests

on:
  push:
  pull_request:

jobs:
  fast:
    # The stubbed suite only: no Postgres, no Ollama. dbt-test-project is part of this repo
    # (dbt-test-project/), so `dbt parse` compiles a real manifest/semantic_manifest from the
    # actual project — no database connection needed for that (verified: `dbt parse` and even
    # MetricFlow's own `list_metrics()` succeed with no reachable Postgres at all), so every
    # test runs for real here, none skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: dbt parse
        working-directory: dbt-test-project
      - run: python tests/run_light.py
